# CodeRabbit. Docs: https://docs.coderabbit.ai/reference/configuration
# Esquema: https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: es-AR
tone_instructions: 'Directo y concreto, en castellano rioplatense. Marcá BLOQUEANTE lo que impide el merge. Leé AGENTS.md del repo.'
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    # Sólo PR contra develop y main (el resto de las ramas no se revisa).
    base_branches:
      - develop
      - main
  path_filters:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/*.lock'
    - '!**/package-lock.json'
    - '!**/*.g.dart'
    - '!**/*.freezed.dart'
  path_instructions:
    - path: '**'
      instructions: 'Proyecto: Paquete Dart/Flutter compartido por splg-app-cliente y splg-app-chofer (modelos de dominio freezed/json_serializable y tema). Leé AGENTS.md. Reglas clave: Todo cambio acá se valida con el gate de la lib y con el de las dos apps: una firma que cambia rompe a los dos consumidores. Marcar BLOQUEANTE un cambio incompatible sin su contraparte en las apps. Nada específico de una sola app: si lo usa una, vive en esa app. Modelos con freezed: tocar uno implica regenerar y commitear los .freezed.dart / .g.dart.'
    - path: 'lib/**'
      instructions: 'Compatibilidad con las dos apps, nada específico de una sola, modelos freezed regenerados.'
    - path: 'test/**'
      instructions: 'Cada test nuevo debe fallar sin el cambio.'
    - path: '.github/**'
      instructions: 'Workflows con permisos mínimos, sin secretos en claro.'
chat:
  auto_reply: true
